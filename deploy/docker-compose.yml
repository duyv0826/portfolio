# 洪兄作品集全站 — Lighthouse 编排（app + postgres + caddy）
# 2核2G 约束：PG 用小内存参数；三个服务合计常驻约 500-600MB。
# 端口规划：现有服务 new-api / imgbed / 主页已在跑，作品集用 3000 对外，
# Caddy 按域名分流，避免与既有 80/443 占用方冲突（见 deploy/README.md 协调说明）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    command:
      # 小内存调优：shared_buffers 256MB 上限，关 JMEM 大页，限制连接数
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
      - -c
      - work_mem=8MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不对外暴露端口，仅同网络内 app 访问
    networks: [portfolio-net]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: portfolio-app
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      RUN_MIGRATIONS: "true"
    networks: [portfolio-net]

  caddy:
    image: caddy:2
    container_name: portfolio-caddy
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [portfolio-net]

volumes:
  pgdata:
  caddydata:
  caddyconfig:

networks:
  portfolio-net:
    driver: bridge
