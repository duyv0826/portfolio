<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 洪兄作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;510;590;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    :root{
      --bg:#0C0C0E; --surface-1:#16161A; --fg:#ECECEE; --fg-2:#A6A6AE; --fg-3:#6C6C74;
      --accent:#E0A458; --accent-hover:#EAB873;
      --border:#2A2A30; --hairline:1px;
      --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-10:120px;
      --radius-md:4px;
      --text-xs:0.75rem; --text-sm:0.875rem; --text-md:1.125rem; --text-2xl:1.875rem; --text-3xl:2.875rem;
      --font-display:'Inter','Noto Sans SC',system-ui,sans-serif;
      --font-body:'Inter','Noto Sans SC',system-ui,sans-serif;
      --font-mono:'JetBrains Mono','Space Mono',ui-monospace,monospace;
      --tracking-caps:0.08em;
      --motion-base:200ms; --ease-standard:cubic-bezier(0.22,0.61,0.36,1);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .wrap{min-height:100vh;display:flex;flex-direction:column;}
    main{flex:1;display:flex;align-items:center;justify-content:center;}
    .notfound{text-align:center;padding:var(--space-10) var(--space-5);}
    .nf-code{font-family:var(--font-mono);font-size:var(--text-2xl);color:var(--accent);margin:0;letter-spacing:var(--tracking-caps);}
    .nf-title{font-family:var(--font-display);font-size:var(--text-3xl);color:var(--fg);margin:var(--space-4) 0 0;}
    .nf-text{font-family:var(--font-body);font-size:var(--text-md);color:var(--fg-2);margin:var(--space-3) 0 0;}
    .btn{display:inline-flex;align-items:center;gap:var(--space-2);background:var(--accent);color:var(--bg);
      font-weight:510;border-radius:var(--radius-md);padding:var(--space-3) var(--space-5);font-size:var(--text-sm);
      margin-top:var(--space-6);transition:background var(--motion-base) var(--ease-standard);}
    .btn:hover{background:var(--accent-hover);}
    .icon{width:20px;height:20px;flex:none;}
    a:focus-visible,button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);}
    footer{border-top:var(--hairline) solid var(--border);padding:var(--space-5);text-align:center;
      font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-3);}
  </style>
</head>
<body>
  <div class="wrap">
    <main>
      <section class="notfound" aria-labelledby="nf-title">
        <p class="nf-code">404</p>
        <h1 class="nf-title" id="nf-title">页面走丢了</h1>
        <p class="nf-text">你访问的链接不存在或已移动，下面是回家的路。</p>
        <a class="btn" href="index.html">返回首页<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </section>
    </main>
    <footer>© 2026 洪兄 · 互动媒体艺术 / 游戏设计</footer>
  </div>
</body>
</html>
